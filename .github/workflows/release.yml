name: Release
# One program version, one exact tag. Dispatch from main; do not pre-create tags.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact program version tag, for example v1.3.4'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: claude-niang-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate source and version metadata
        shell: powershell
        run: |
          if($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -ne 'refs/heads/main'){throw 'Dispatch this workflow from main'}
          node .\tools\release.mjs --source . --check-release --tag $env:RELEASE_TAG
          if($LASTEXITCODE -ne 0){throw 'Release metadata validation failed'}
      - name: Node tests
        working-directory: claude-niang
        run: npm test
      - name: Windows integration tests
        working-directory: claude-niang
        shell: powershell
        run: npm run test:windows
      - name: Build and verify the three release assets
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP ('claude-niang-release-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          .\build-release.ps1 -OutDir $out
          if($LASTEXITCODE -ne 0){throw 'Release build failed'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $out ('claude-niang-'+$env:RELEASE_TAG+'-windows.zip')
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try{
            $entries=@($archive.Entries | Where-Object { $_.FullName -like '*/claude-niang-usage.mcpb' })
            if($entries.Count -ne 1 -or $entries[0].Length -le 0){throw 'Release ZIP must contain exactly one desktop extension'}
            $stream=$entries[0].Open();$sha=[Security.Cryptography.SHA256]::Create()
            try{$digest=([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','').ToLowerInvariant()}
            finally{$stream.Dispose();$sha.Dispose()}
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0],(Join-Path $out 'claude-niang-usage.mcpb'),$false)
          }finally{$archive.Dispose()}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('RELEASE_DIR='+$out) -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('MCPB_SHA256='+$digest) -Encoding UTF8
      - name: Create or resume owned draft, verify uploads, then publish
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .\tools\release.mjs --source . --publish --tag $env:RELEASE_TAG --assets $env:RELEASE_DIR
          if($LASTEXITCODE -ne 0){throw 'Release was not completed; inspect the error before retrying'}
