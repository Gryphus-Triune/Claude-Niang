name: Release
# Pushing v1.3.2 or v1.3.2-repack.1 tests the matching code, builds the package
# and publishes a GitHub release with its checksum and desktop extension.
# The release notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag, for example v1.3.2-repack.1'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package version
        shell: powershell
        run: |
          $version=(Get-Content claude-niang/package.json -Raw | ConvertFrom-Json).version
          $tag=$env:RELEASE_TAG
          $pattern='^v'+[regex]::Escape($version)+'(?:-repack\.[1-9][0-9]*)?$'
          if($tag -cnotmatch $pattern){throw "Tag $tag does not match package.json version $version"}
      - name: Node tests
        working-directory: claude-niang
        run: npm test
      - name: Windows integration tests
        working-directory: claude-niang
        shell: powershell
        run: npm run test:windows
      - name: Build release package
        shell: powershell
        run: .\build-release.ps1
      - name: Prepare assets and notes
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          $archive=[IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try{
            $entry=$archive.Entries | Where-Object { $_.FullName -like '*/claude-niang-usage.mcpb' } | Select-Object -First 1
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path $PWD 'dist\claude-niang-usage.mcpb'),$true)
          }finally{$archive.Dispose()}
          $version=$env:RELEASE_TAG.Substring(1)
          $lines=Get-Content CHANGELOG.md -Encoding UTF8
          $start=[Array]::FindIndex($lines,[Predicate[string]]{param($line)$line -like "## $version *"})
          if($start -lt 0){throw "CHANGELOG.md has no section for $version"}
          $end=[Array]::FindIndex($lines,$start+1,[Predicate[string]]{param($line)$line -like '## *'})
          if($end -lt 0){$end=$lines.Count}
          $notes=($lines[($start+1)..($end-1)] -join "`n").Trim()
          [IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'),$notes+"`n",[Text.UTF8Encoding]::new($false))
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch'){
            git tag -- $env:RELEASE_TAG $env:GITHUB_SHA
            if($LASTEXITCODE -ne 0){throw 'Could not create the release tag'}
            git push origin "refs/tags/$env:RELEASE_TAG"
            if($LASTEXITCODE -ne 0){throw 'Could not push the release tag; it may already exist'}
          }
          $assets=@(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --title "Claude 娘 $env:RELEASE_TAG · Windows" --notes-file release-notes.md --verify-tag --latest
          if($LASTEXITCODE -ne 0){throw 'Could not publish the release'}
